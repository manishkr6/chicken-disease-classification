    { name = "manishkr6", email = "manishkr8927@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "certifi>=2026.7.22",
    "dvc>=3.67.1",
    "ensure==1.0.2",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "joblib>=1.6.0",
    "matplotlib>=3.11.2",
    "notebook>=7.6.3",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "python-box==6.0.2",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "tqdm>=4.70.1",
    "types-pyyaml>=6.0.12.20260906",
]

[project.scripts]
chicken-disease-classification = "chicken_disease_classification:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
